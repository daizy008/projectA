<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project A</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
        }
        .container { text-align: center; padding: 3rem; }
        h1 {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p { font-size: 1.25rem; color: #a0aec0; margin-bottom: 2rem; }
        .tag {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
            border-radius: 50px;
            color: #00d4ff;
            font-size: 0.875rem;
        }
        .time { margin-top: 3rem; color: #4a5568; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Project A</h1>
        <p>Auto-deployed via Minis · GitHub Pages</p>
        <span class="tag">🚀 Live</span>
        <div class="time">部署时间: 2026-05-31 22:38:13</div>
    </div>
</body>
</html>
